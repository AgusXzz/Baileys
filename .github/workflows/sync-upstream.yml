name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream
        run: |
          git remote add upstream https://github.com/WhiskeySockets/Baileys.git || true
          git fetch upstream

      - name: Merge Upstream
        run: |
          git checkout master
          git merge upstream/master --no-edit || true

      - name: Push
        run: |
          git push origin master
